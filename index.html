<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="الموقع الرسمي للفنان أحمد حرب، مطرب عربي فلسطيني. أغانٍ هادئة ورومانسية بالعربية والتركية. جديدي: قالت حبيبي.">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9242996523787104" crossorigin="anonymous"></script>
<style>
:root{--bg:#0b1114;--fg:#eaf2f2;--muted:#9fb0b0;--line:#1b2a2a;--card:#101b1b;--accent:#6ee7d8}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,Arial}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.nav{position:sticky;top:0;z-index:10;background:rgba(11,17,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
.brand{font-weight:800}
.nav ul{display:flex;list-style:none;gap:1.2rem;margin:0;padding:0;color:var(--muted);flex-wrap:wrap}
.nav a:hover{color:var(--fg)}
.hero{padding:30px 0}
.hero-card{width:100%;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:28px;overflow:hidden;display:grid;grid-template-columns:1.1fr .9fr}
.hero-media{min-height:520px;background:#0f1c1c}
.hero-media img{width:100%;height:100%;object-fit:cover;display:block}
.hero-content{padding:36px}
.kicker{color:var(--accent);letter-spacing:.2em;font-size:.8rem}
h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:.5rem 0}
.lead{color:var(--muted);line-height:1.8}
.cta{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-weight:600}
.btn.solid{background:var(--fg);color:#0b1114;border-color:var(--fg)}
.section{padding:56px 0;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--muted)}
.card h3{margin:0;display:flex;align-items:center;gap:10px;font-size:1.05rem}
.card .icon{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:14px;font-weight:800;flex-shrink:0}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.02);padding:10px 14px;border-radius:999px;display:flex;align-items:center;gap:8px}
.chip:hover{background:rgba(255,255,255,.06)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.9rem}
@media (max-width:900px){.hero-card{grid-template-columns:1fr}.hero-media{min-height:420px}.grid{grid-template-columns:1fr 1fr}}
